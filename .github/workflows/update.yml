name: Update internship feed

on:
  schedule:
    - cron: "0 13 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile internship feed
        run: python fetch_internships.py

      - name: Commit updated feed
        run: |
          git config user.name "internship-bot"
          git config user.email "actions@github.com"
          git add output/internships.csv output/internships.html
          git commit -m "Update internship feed" || echo "No changes to commit"
          git push
